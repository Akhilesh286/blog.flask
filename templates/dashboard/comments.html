<div class="dash-page">
  <h2><i class="bi bi-chat-dots"></i> Comments</h2>
  {% set user_comments = current_user.comments %}
  {% if user_comments %}
    {% for comment in user_comments %}
    <div class="post-card" style="margin-bottom:var(--space-md)">
      <p style="color:var(--text-title);margin-bottom:var(--space-xs)">{{ comment.content }}</p>
      <div class="post-meta" style="border:none;margin:0;padding:0">
        <span class="post-date">
          <i class="bi bi-clock"></i> {{ comment.created_at | timeago }}
        </span>
        <span class="post-date">on
          <a href="{{ url_for('content', slug=comment.post.slug) }}">{{ comment.post.title }}</a>
        </span>
      </div>
    </div>
    {% endfor %}
  {% else %}
  <div class="empty-state">
    <i class="bi bi-chat-dots"></i>
    <p>No comments yet</p>
  </div>
  {% endif %}
</div>
