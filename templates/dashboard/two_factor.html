<div class="dash-page">
  <h2><i class="bi bi-key"></i> Two-Factor Authentication</h2>

  <div class="post-card" style="margin-bottom:var(--space-lg)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-md)">
      <h3 style="color:var(--text-title);margin:0">Authenticator App</h3>
      <button class="btn btn-sm btn-primary">Enable</button>
    </div>
    <p style="font-size:var(--font-size-caption);color:var(--text-disabled)">
      Use an authenticator app like Google Authenticator or Authy to generate one-time codes.
    </p>
  </div>

  <div class="post-card">
    <h3 style="color:var(--text-title);margin-bottom:var(--space-md)">Backup Codes</h3>
    <p style="font-size:var(--font-size-caption);color:var(--text-disabled)">
      Generate backup codes to use when you don't have access to your authenticator app.
    </p>
    <button class="btn btn-ghost btn-sm" style="margin-top:var(--space-sm)">Generate Backup Codes</button>
  </div>
</div>
