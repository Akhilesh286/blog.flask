{% for post in posts %}
<article class="post-card" id="post-{{ post.id }}">
  <div class="post-header">
    <a href="{{ url_for('content', slug=post.slug) }}" class="post-title">
      <h2>{{ post.title }}</h2>
      {% if post.description %}
      <p class="post-desc">{{ post.description }}</p>
      {% endif %}
    </a>
  </div>

  <div class="post-meta">
    <a href="{{ url_for('profile', username=post.author.username) }}" class="post-author">
      <img
        class="avatar avatar-sm"
        {% if post.author.profile and post.author.profile.pic %}
        src="{{ url_for('media', filename='uploads/' ~ post.author.profile.pic) }}"
        {% else %}
        src="{{ url_for('static', filename='images/prf.jpeg') }}"
        {% endif %}
        alt=""
      >
      <span>{{ post.author.username }}</span>
    </a>
    <span class="post-date">
      <i class="bi bi-clock"></i>
      {{ post.created_at | timeago }}
    </span>
  </div>
</article>
{% else %}
<div class="empty-state">
  <i class="bi bi-journal-text"></i>
  <p>No posts yet. Be the first to write something!</p>
</div>
{% endfor %}
