<div class="modal-overlay" id="deleteModal">
  <div class="modal-content" id="deleteModalContent">
    <h3>Delete Post</h3>
    <p>Are you sure you want to delete <strong style="color:var(--text-title)">{{ post.title }}</strong>? This action cannot be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
      <form action="{{ url_for('archive_post', post_id=post.id) }}" method="POST" style="display:inline">
        <button type="submit" class="btn btn-ghost">
          <i class="bi bi-archive"></i> Archive Instead
        </button>
      </form>
      <button
        class="btn btn-danger"
        hx-delete="{{ url_for('delete_post', post_id=post.id) }}"
        hx-target="#post-{{ post.id }}"
        hx-swap="outerHTML"
        data-bs-dismiss="modal"
      >
        <i class="bi bi-trash"></i> Delete
      </button>
    </div>
  </div>
</div>

  position: fixed;
  inset: 0;

  padding: var(--space-md);
}

}

  color: var(--text-title);

}

  color: var(--text-body);
  margin-bottom: var(--space-lg);
}
.modal-actions {
  display: flex;
  gap: var(--gap-md);
  justify-content: flex-end;
  flex-wrap: wrap;
}
</style>
