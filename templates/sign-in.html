{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block head %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/sign-in.css') }}">
{% endblock %}

{% block body %}
<main class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Welcome back</h1>
      <p>Sign in to your account</p>
    </div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form action="/sign-in" method="post" class="auth-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" class="input" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" class="input" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg auth-submit">Sign In</button>
    </form>

    <p class="auth-alt">
      Don't have an account? <a href="/sign-up">Create one</a>
    </p>
  </div>
</main>
{% endblock %}
