{% extends "base.html" %}

{% block title %}Sign Up{% endblock %}

{% block head %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/sign-in.css') }}">
{% endblock %}

{% block body %}
<main class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Create account</h1>
      <p>Join the blog community</p>
    </div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form action="/sign-up" method="post" class="auth-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" class="input" placeholder="your-username" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" class="input" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" class="input" placeholder="Create a password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg auth-submit">Sign Up</button>
    </form>

    <p class="auth-alt">
      Already have an account? <a href="/sign-in">Sign in</a>
    </p>
  </div>
</main>
{% endblock %}
