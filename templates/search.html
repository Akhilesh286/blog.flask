{% extends "base.html" %}

{% block title %}Search{% endblock %}

{% block head %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/search.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/posts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/users.css') }}">
{% endblock %}

{% block body %}
<main class="page">
  <div class="container">
    <div class="search-page">
      <div class="search-box">
        <div class="search-input-wrap">
          <i class="bi bi-search"></i>
          <input
            type="text"
            name="q"
            class="input search-input"
            hx-get="/search-people"
            hx-trigger="keyup changed delay:300ms"
            hx-target="#results"
            placeholder="Search posts and people..."
            autofocus
          >
        </div>
        <div class="search-tabs">
          <button type="button" class="btn btn-sm btn-primary switch-btn" data-target="/search-people" data-placeholder="Search people..." data-active="1" id="btn-people">
            <i class="bi bi-people"></i> People
          </button>
          <button type="button" class="btn btn-sm btn-ghost switch-btn" data-target="/search-posts" data-placeholder="Search posts..." id="btn-posts">
            <i class="bi bi-file-text"></i> Posts
          </button>
        </div>
      </div>
      <div id="results" class="search-results">
        <div class="empty-state">
          <i class="bi bi-search"></i>
          <p>Type to search...</p>
        </div>
      </div>
    </div>
  </div>
</main>

{% block scripts %}
  <script src="{{ url_for('static', filename='js/search.js') }}"></script>
{% endblock %}
{% endblock %}
