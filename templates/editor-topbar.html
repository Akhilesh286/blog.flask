
<header class="topbar">
    <input type="text"
       id="title"
       name="title"
       value="{{ post.title | default('') }}"
       placeholder="Enter title">

    <textarea id="description"
            name="description"
            rows="5"
            placeholder="Enter description">{{ post.description | default('') }}</textarea>
    <div>
      <button type="submit" name="status" value="published">Publish</button>
      <button type="submit" name="status" value="draft">Draft</button>
    </div>
</header>
