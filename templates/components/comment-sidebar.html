<div class="comment-section-inline" id="comment-box">
  <div id="comment-panel" class="comments">
  </div>
  <div class="comment-form">
    <form
      id="comment-form"
      hx-post="{{ url_for('comments.add_comment', post_id=post.id) }}"
      hx-target="#comment-panel"
      hx-swap="afterbegin"
      hx-on::after-request="this.reset()"
    >
      <div class="comment-input-row">
        <textarea id="chatInput" name="content" class="input" rows="1" placeholder="Write a comment..." required></textarea>
        <input type="hidden" id="parentId" name="parentId" value="">
        <button type="submit" class="btn btn-primary btn-sm">
          <i class="bi bi-send"></i>
        </button>
      </div>
    </form>
  </div>
</div>
