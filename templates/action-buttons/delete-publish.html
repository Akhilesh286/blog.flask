<div class="dropdown">

        <i class="bi bi-three-dots-vertical"></i>
    </button>
    <ul class="dropdown-menu">
        <li><a class="dropdown-item publish" href="/posts/{{post.id}}/publish">Publish</a></li>
        <li>
            <a 
                class="dropdown-item delete"

                data-bs-target="#deleteModal"
                href="#"

    </ul>
</div>
