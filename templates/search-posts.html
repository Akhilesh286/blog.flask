{% for post in posts %}
<article class="post-card">
  <a href="/post/{{ post.slug }}" class="post-title">
    <h2>{{ post.title }}</h2>
    {% if post.description %}
    <p class="post-desc">{{ post.description }}</p>
    {% endif %}
  </a>
  <div class="post-meta" style="border:none;margin:var(--space-sm) 0 0 0;padding:0">
    <span class="post-date">
      <i class="bi bi-clock"></i> {{ post.created_at | timeago }}
    </span>
  </div>
</article>
{% else %}
<div class="empty-state">
  <i class="bi bi-search"></i>
  <p>No posts found</p>
</div>
{% endfor %}
