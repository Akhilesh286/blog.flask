{% extends "base.html" %}
{% block title %}Test{% endblock %}
{% block body %}
<main class="page">
  <div class="container">
    <h1 class="section-title">Test Page</h1>
    <div class="post-container">
      {% for user in users %}
      <div class="post-card">
        <div class="post-header">
          <div class="post-author">
            <img class="avatar avatar-sm" src="{{ url_for('static', filename='images/prf.jpeg') }}" alt="">
            <span>{{ user.username }}</span>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</main>
{% endblock %}
